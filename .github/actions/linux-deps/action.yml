name: Linux dependencies
description: Install the native libraries GPUI needs to build on Ubuntu 24.04.

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc \
          g++ \
          clang \
          pkg-config \
          libfontconfig-dev \
          libwayland-dev \
          libwebkit2gtk-4.1-dev \
          libxkbcommon-x11-dev \
          libx11-xcb-dev \
          libssl-dev \
          libzstd-dev \
          libasound2-dev \
          vulkan-validationlayers \
          libvulkan1
