name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  get-tag:
    name: Find draft release
    if: (github.event_name == 'pull_request' && github.head_ref == 'knope/release' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Find Knope draft release
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          for attempt in $(seq 1 30); do
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
              --json isDraft,tagName \
              --jq '[.[] | select(.isDraft and (.tagName | startswith("v")))][0].tagName // ""')"

            if [[ -n "$tag" ]]; then
              if [[ "${tag#v}" == "$package_version" ]]; then
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
                echo "Found draft release $tag."
                exit 0
              fi
              echo "Draft release $tag does not match Cargo.toml version $package_version; waiting..."
            else
              echo "No draft release yet (attempt $attempt/30); waiting 10s..."
            fi

            sleep 10
          done

          echo "No draft release found. Install Knope Bot and merge its release PR first." >&2
          exit 1

  build:
    name: Build (${{ matrix.target }})
    needs: get-tag
    if: needs.get-tag.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-tag.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.get-tag.outputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="android-cli-gui-v${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${asset}" android-cli-gui
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "android-cli-gui-v$($env:VERSION)-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/android-cli-gui.exe" -DestinationPath "dist/$asset"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload assets and publish
    needs: [get-tag, build]
    if: needs.get-tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.get-tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --clobber ./*
          gh release edit "$TAG" --draft=false --latest

  homebrew:
    name: Update Homebrew tap
    needs: [publish, get-tag]
    if: needs.get-tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.get-tag.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Render formula
        shell: bash
        env:
          VERSION: ${{ needs.get-tag.outputs.version }}
        run: |
          set -euo pipefail

          sha() {
            sha256sum "dist/$1" | cut -d' ' -f1
          }

          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_MACOS_ARM64__/$(sha "android-cli-gui-v${VERSION}-aarch64-apple-darwin.tar.gz")/g" \
            -e "s/__SHA256_MACOS_X86_64__/$(sha "android-cli-gui-v${VERSION}-x86_64-apple-darwin.tar.gz")/g" \
            packaging/homebrew/android-cli-gui.rb.tmpl \
            > dist/android-cli-gui.rb

          ruby -c dist/android-cli-gui.rb
      - name: Push formula to tap
        shell: bash
        env:
          TAG: ${{ needs.get-tag.outputs.tag }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/homebrew_tap"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"

          rm -rf tap
          git clone --depth 1 git@github.com:RayhanHamada/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp dist/android-cli-gui.rb tap/Formula/android-cli-gui.rb

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/android-cli-gui.rb

          if git -C tap diff --cached --quiet; then
            echo "Formula is already up to date."
          else
            git -C tap commit -m "android-cli-gui ${TAG}"
            git -C tap push origin HEAD:main
          fi
