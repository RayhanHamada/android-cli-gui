[package]
name = "android-cli-gui"
version = "0.1.4"
edition = "2024"

[dependencies]
gpui-kit = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keep app code in Debug while the UI stack stays fast at runtime.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
